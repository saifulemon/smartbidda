<!doctype html>
<html lang="bn-BD">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অভিভাবক প্রবেশ — স্মার্টবিদ্যা</title>
<link rel="stylesheet" href="../../styles/theme.css">
<link rel="stylesheet" href="../../styles/components.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  /* page-local LAYOUT only — every colour / font-size / radius / shadow is a var(--…).
     PinLayout: NO appbar, NO tabbar — centred full-screen PIN pad. */
  .pl-shell {
    display: flex; flex-direction: column; justify-content: center;
    gap: var(--space-xl);
    min-height: 100dvh;
    max-width: 400px;
    margin: 0 auto;
    padding: var(--space-xl) var(--space-lg);
    /* notch / home-indicator clearance */
    padding-bottom: env(safe-area-inset-bottom, var(--space-xl));
  }
  .pl-head { display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); text-align: center; }
  .pl-mark {
    display: grid; place-items: center; width: 72px; height: 72px;
    background: var(--c-primary-soft); color: var(--c-primary);
    border-radius: var(--radius-pill);
  }

  /* 6-digit PIN dots + Bangla keypad */
  .pl-dots { display: flex; justify-content: center; gap: var(--space-md); }
  .pl-dot { width: 14px; height: 14px; border-radius: var(--radius-pill);
    background: var(--c-surface-soft); border: var(--border-w) solid var(--c-hairline-strong); }
  .pl-dot.is-filled { background: var(--c-primary); border-color: var(--c-primary); }
  .pl-keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-sm); }
  .pl-key {
    display: grid; place-items: center; min-height: calc(var(--control-h) + var(--space-md));
    background: var(--c-lift); color: var(--c-ink); cursor: pointer;
    border: var(--border-w) solid var(--c-hairline-strong); border-radius: var(--radius-lg);
    font-family: var(--t-body-md-family); font-size: var(--t-title-lg-size); font-weight: var(--t-weight-bold);
  }
  .pl-key:hover { border-color: var(--c-primary); }
  .pl-key.is-ghost { background: transparent; border-color: transparent; cursor: default; }

  /* PRD L2269: email/password fallback expander */
  .pl-expander {
    display: flex; align-items: center; gap: var(--space-sm); width: 100%; padding: 0;
    background: transparent; border: 0; color: var(--c-ink); cursor: pointer;
    font-family: var(--t-body-md-family);
  }
  .pl-fields { display: flex; flex-direction: column; gap: var(--space-md); margin-top: var(--space-md); }
</style>
</head>
<body data-app="frontend" data-layout="PinLayout">

  <!-- PinLayout: NO appbar, NO tabbar — centred full-screen PIN pad -->
  <main class="pl-shell" data-shell="content">

    <div class="pl-head">
      <span class="pl-mark" data-component="media" aria-hidden="true"><i data-lucide="shield" class="icon-lg"></i></span>
      <h1 class="t-display-md" data-testid="plogin-heading">অভিভাবক প্রবেশ</h1>
      <p class="t-body-sm t-muted" data-testid="plogin-sub">৬ সংখ্যার পিন দিয়ে ঢুকুন</p>
    </div>

    <div>
      <div class="pl-dots" role="group" aria-label="পিনের অঙ্ক" aria-describedby="plogin-hint">
        <span class="pl-dot is-filled" data-testid="plogin-dot"></span>
        <span class="pl-dot is-filled" data-testid="plogin-dot"></span>
        <span class="pl-dot is-filled" data-testid="plogin-dot"></span>
        <span class="pl-dot" data-testid="plogin-dot"></span>
        <span class="pl-dot" data-testid="plogin-dot"></span>
        <span class="pl-dot" data-testid="plogin-dot"></span>
      </div>
      <p class="t-caption" id="plogin-hint" style="margin-top:var(--space-md);text-align:center" data-testid="plogin-hint">
        ভুল হলে আবার দিতে পারবেন — ৩ বার ভুল হলে ১০ মিনিট বন্ধ থাকবে
      </p>
    </div>

    <div class="pl-keys" role="group" aria-label="সংখ্যা নির্বাচন">
      <button class="pl-key" type="button" data-testid="plogin-key">১</button>
      <button class="pl-key" type="button" data-testid="plogin-key">২</button>
      <button class="pl-key" type="button" data-testid="plogin-key">৩</button>
      <button class="pl-key" type="button" data-testid="plogin-key">৪</button>
      <button class="pl-key" type="button" data-testid="plogin-key">৫</button>
      <button class="pl-key" type="button" data-testid="plogin-key">৬</button>
      <button class="pl-key" type="button" data-testid="plogin-key">৭</button>
      <button class="pl-key" type="button" data-testid="plogin-key">৮</button>
      <button class="pl-key" type="button" data-testid="plogin-key">৯</button>
      <button class="pl-key is-ghost" type="button" data-testid="plogin-key-blank" aria-hidden="true" disabled></button>
      <button class="pl-key" type="button" data-testid="plogin-key">০</button>
      <button class="pl-key" type="button" data-testid="plogin-key-delete" aria-label="মুছুন">
        <i data-lucide="delete" class="icon-md" aria-hidden="true"></i>
      </button>
    </div>

    <div class="ksr-stack">
      <!-- thumb-reach primary -->
      <button class="ksr-btn is-block" type="button" data-testid="plogin-submit">প্যারেন্ট মোডে ঢোকো</button>

      <!-- PRD L2269: Email/password fallback | collapsed "পিন মনে নেই?" expander |
           expanded shows the form with inline errors (L2286 parentPin is the pin row) -->
      <section class="ksr-panel" data-component="form" aria-labelledby="plogin-fallback-label">
        <button class="pl-expander" type="button" aria-expanded="true" aria-controls="plogin-fallback"
                data-testid="plogin-fallback-toggle">
          <i data-lucide="key-round" class="icon-sm" aria-hidden="true"></i>
          <span class="t-body-sm t-semibold ksr-grow" id="plogin-fallback-label">পিন মনে নেই?</span>
          <i data-lucide="chevron-up" class="icon-sm" aria-hidden="true"></i>
        </button>
        <div id="plogin-fallback" class="pl-fields">
          <label class="field">
            <span class="t-caption" data-testid="plogin-email-label">ইমেইল</span>
            <input class="input" type="email" autocomplete="email" data-testid="plogin-email-input">
          </label>
          <label class="field">
            <span class="t-caption" data-testid="plogin-pass-label">পাসওয়ার্ড</span>
            <input class="input" type="password" autocomplete="current-password" data-testid="plogin-pass-input">
          </label>
        </div>
      </section>
    </div>

  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
