<!doctype html>
<html lang="bn-BD">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কুইজ — স্মার্টবিদ্যা</title>
<link rel="stylesheet" href="../../styles/theme.css">
<link rel="stylesheet" href="../../styles/components.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  /* page-local LAYOUT only — every colour / font-size / radius / shadow is a var(--…) token */

  /* notch / home-indicator clearance — this page's own layout class */
  .qz-body { padding-bottom: calc(var(--space-xxl) + env(safe-area-inset-bottom)); }

  /* progress dots */
  .qz-dots { display: flex; flex-wrap: wrap; gap: var(--space-sm); list-style: none; margin: 0; padding: 0; }
  .qz-dot { width: 9px; height: 9px; border-radius: var(--radius-pill); background: var(--c-surface-soft); }
  .qz-dot.is-done { background: var(--c-hairline-strong); }
  .qz-dot.is-current { background: var(--c-primary); box-shadow: 0 0 0 3px var(--c-primary-soft); }

  /* the fraction visual — drawn with divs, no photo */
  .qz-frac { display: flex; flex-direction: column; justify-content: center; gap: var(--space-lg);
    padding: var(--space-xl); background: var(--c-surface);
    border: var(--border-w) solid var(--c-hairline); }
  .qz-frac-row { display: flex; gap: var(--space-xs); }
  .qz-frac-cell { flex: 1; min-height: 46px; border-radius: var(--radius-xs);
    background: var(--c-surface-soft); border: var(--border-w) solid var(--c-hairline-strong); }
  .qz-frac-cell.is-fill { background: var(--c-primary); border-color: var(--c-primary); }

  /* answer options — wide stacked pills */
  .qz-options { display: flex; flex-direction: column; gap: var(--space-md); }
  .qz-opt { display: flex; align-items: center; gap: var(--space-md); width: 100%;
    min-height: 60px; padding: var(--space-md) var(--space-lg); cursor: pointer;
    background: var(--c-lift); color: var(--c-body); text-align: start;
    border: var(--border-w) solid var(--c-hairline-strong); border-radius: var(--radius-pill);
    font-family: var(--font-body); font-size: var(--t-body-lg-size);
    font-weight: var(--t-weight-semibold); min-width: 0; }
  .qz-opt:hover { border-color: var(--c-primary); color: var(--c-ink); }
  .qz-opt.is-picked { background: var(--c-primary); color: var(--c-on-primary);
    border-color: var(--c-primary); }
  .qz-opt-mark { display: inline-grid; place-items: center; flex-shrink: 0; }
</style>
</head>
<body data-app="frontend" data-layout="StudentSubLayout">

  <!-- StudentSubLayout chrome: back + title appbar, NO tabbar -->
  <header class="ksr-appbar" data-shell="topbar">
    <a class="ksr-back" href="07-lesson.html" aria-label="ফিরে যান" data-testid="sub-back">
      <i data-lucide="arrow-left" class="icon-sm" aria-hidden="true"></i>
      ফিরে যান
    </a>
    <span class="ksr-appbar-title" data-slot="title" data-testid="sub-title">কুইজ</span>
  </header>

  <main class="ksr-main qz-body" data-shell="content">

    <!-- 4 · timer — a thin green line across the top -->
    <div class="progress is-sm" role="progressbar" aria-valuenow="48" aria-valuemin="0"
         aria-valuemax="60" aria-label="সময় বাকি">
      <div class="progress-fill" style="width:80%"></div>
    </div>

    <div class="row">
      <p class="t-caption ksr-grow" data-testid="quiz-counter">প্রশ্ন ৩ / ১০</p>
      <span class="ksr-badge" role="timer" data-testid="quiz-timer">
        <i data-lucide="clock" class="icon-sm" aria-hidden="true"></i>
        ৪৮ সেকেন্ড বাকি
      </span>
    </div>

    <!-- 5 · progress dots -->
    <ol class="qz-dots" role="group" aria-label="কুইজের অগ্রগতি" data-testid="quiz-dots">
      <li class="qz-dot is-done" data-testid="quiz-dot" aria-label="প্রশ্ন ১"></li>
      <li class="qz-dot is-done" data-testid="quiz-dot" aria-label="প্রশ্ন ২"></li>
      <li class="qz-dot is-done is-current" data-testid="quiz-dot" aria-current="step" aria-label="প্রশ্ন ৩"></li>
      <li class="qz-dot" data-testid="quiz-dot" aria-label="প্রশ্ন ৪"></li>
      <li class="qz-dot" data-testid="quiz-dot" aria-label="প্রশ্ন ৫"></li>
      <li class="qz-dot" data-testid="quiz-dot" aria-label="প্রশ্ন ৬"></li>
      <li class="qz-dot" data-testid="quiz-dot" aria-label="প্রশ্ন ৭"></li>
      <li class="qz-dot" data-testid="quiz-dot" aria-label="প্রশ্ন ৮"></li>
      <li class="qz-dot" data-testid="quiz-dot" aria-label="প্রশ্ন ৯"></li>
      <li class="qz-dot" data-testid="quiz-dot" aria-label="প্রশ্ন ১০"></li>
    </ol>

    <!-- 1 · media-first: the fraction visual, drawn with divs -->
    <div class="media qz-frac" role="img" data-component="media" data-testid="quiz-stimulus"
         aria-label="ছবি: ভগ্নাংশের চিত্র — উপরের আয়ত চার ভাগে ভাগ করা, তিন ভাগ রং করা; নিচের আয়ত দুই ভাগে ভাগ করা, এক ভাগ রং করা">
      <div class="qz-frac-row">
        <span class="qz-frac-cell is-fill"></span>
        <span class="qz-frac-cell is-fill"></span>
        <span class="qz-frac-cell is-fill"></span>
        <span class="qz-frac-cell"></span>
      </div>
      <div class="qz-frac-row">
        <span class="qz-frac-cell is-fill"></span>
        <span class="qz-frac-cell"></span>
      </div>
    </div>

    <div class="row">
      <i data-lucide="image" class="icon-md" aria-hidden="true"></i>
      <span class="t-caption">ছবি: ভগ্নাংশের চিত্র</span>
    </div>

    <section class="ksr-section" aria-labelledby="quiz-question">
      <p class="ksr-eyebrow" data-testid="quiz-subject">গণিত · অধ্যায় ৪</p>
      <p class="t-title-lg" id="quiz-question" data-testid="quiz-question">নিচের কোন অংশটি অর্ধেকের চেয়ে বড়?</p>
    </section>

    <!-- 2 · exactly four tappable options, one selected -->
    <div class="qz-options" role="group" aria-label="উত্তরের বিকল্প">
      <button class="qz-opt" type="button" aria-pressed="false" data-testid="quiz-option">
        <span class="qz-opt-mark"><i data-lucide="circle" class="icon-sm" aria-hidden="true"></i></span>
        ১ / ৪
      </button>
      <button class="qz-opt is-picked" type="button" aria-pressed="true" data-testid="quiz-option" data-id="q3-b">
        <span class="qz-opt-mark"><i data-lucide="check" class="icon-sm" aria-hidden="true"></i></span>
        ৩ / ৪
      </button>
      <button class="qz-opt" type="button" aria-pressed="false" data-testid="quiz-option">
        <span class="qz-opt-mark"><i data-lucide="circle" class="icon-sm" aria-hidden="true"></i></span>
        ১ / ৫
      </button>
      <button class="qz-opt" type="button" aria-pressed="false" data-testid="quiz-option">
        <span class="qz-opt-mark"><i data-lucide="circle" class="icon-sm" aria-hidden="true"></i></span>
        ২ / ৩
      </button>
    </div>

    <!-- 3 · voice control — the question read aloud in Bangla -->
    <div class="ksr-panel" data-component="card" data-testid="quiz-voice-panel">
      <div class="row">
        <button class="ksr-play" type="button" aria-label="প্রশ্নটি শুনুন" data-testid="quiz-voice-play">
          <i data-lucide="volume-2" class="icon-sm" aria-hidden="true"></i>
        </button>
        <span class="ksr-col ksr-grow">
          <span class="ksr-item-t">শুনুন</span>
          <span class="t-caption" data-testid="quiz-voice-label">প্রশ্নটি শুনে নিন</span>
        </span>
      </div>
    </div>

    <p class="t-caption" data-testid="quiz-auto-note">
      উত্তর দিলেই ০.৪ সেকেন্ড পরে পরের প্রশ্ন আসবে। শেষ প্রশ্নের উত্তর দেওয়া মাত্রই
      নিজে থেকেই জমা হয়ে যাবে — আলাদা করে জমা দিতে হবে না।
    </p>

  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
