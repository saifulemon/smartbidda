id: US-09-REMEDIAL
role: teacher
feature: "Admin remedial queue — list, filter and sort AI/teacher remedial assignments and escalated retakes, then reassign content, complete, dismiss or escalate a case"
page: 09-remedial.html
goal: |
  As an admin on the রিমিডিয়াল page I can review the whole remedial queue (AI suggestions and teacher
  suggestions together), search and sort it by case, and reassign content, mark a case complete with a
  reason, dismiss it with a reason or escalate it to a senior — so that no struggling student stays
  unassigned after a failed quiz.
scenarios_total: 25

acceptance_criteria:
  - id: AC-1
    description: "Remedial queue loads with both AI and teacher sources, statuses and case numbers"
    ui_route: /admin/remedial
    endpoint: GET /api/admin/remedial
    expected: "200 — heading 'রিমিডিয়াল' (remedial-heading) with 'মোট ১২৪ টি · ১৮ টি তালিকাভুক্ত' (remedial-count) and note 'AI সুপারিশ ও শিক্ষকের নিজের সুপারিশ — দুটোই একসাথে' (remedial-source-note); table remedial-table renders remedial-row re-1 'SB-CASE-202610-0124' · রাফিদ হাসান · গণিত · ভগ্নাংশের তুলনা · source badge 'AI' · status 'তালিকাভুক্ত', re-2 source badge 'শিক্ষক' status 'চলছে'"
  - id: AC-2
    description: "Search by student or chapter narrows the queue server-side"
    ui_route: /admin/remedial
    endpoint: GET /api/admin/remedial
    expected: "200 — typing 'ভগ্নাংশ' into remedial-search (placeholder 'শিক্ষার্থী বা অধ্যায় দিয়ে খুঁজুন') requests ?search=ভগ্নাংশ and only matching remedial-row entries (re-1) remain; clearing restores the full queue"
  - id: AC-3
    description: "Sortable headers re-order the queue via the API"
    ui_route: /admin/remedial
    endpoint: GET /api/admin/remedial
    expected: "200 — clicking 'নির্ধারিত' (data-sort=assignedAt, initially aria-sort=ascending) toggles direction; 'কেস নং', 'শিক্ষার্থী', 'বিষয়', 'উৎস' and 'অবস্থা' headers each send their own sort key"
  - id: AC-4
    description: "Escalation-status filter shows the escalated retake slice of the queue"
    ui_route: /admin/remedial
    endpoint: GET /api/admin/remedial
    expected: "200 — filtering on escalation status requests ?escalated=true and the table returns only escalated rows such as re-3 with badge 'উর্ধ্বতনে পাঠানো' (is-warn) and remedial-count updates accordingly"
  - id: AC-5
    description: "Reassign remedial content from the row menu"
    ui_route: /admin/remedial
    endpoint: PATCH /api/admin/remedial/:id
    expected: "200 — 'পুনরায় নিয়োগ' (remedial-menu-reassign) opens remedial-modal 'নিজে থেকে সুপারিশ' with remedial-f-content set to 'ভগ্নাংশের তুলনা — সহজ ব্যাখ্যা'; 'সংরক্ষণ' (remedial-modal-save) closes the modal and the row keeps status 'চলছে' with the new content attached"
  - id: AC-6
    description: "Mark a case manually complete — reason is mandatory"
    ui_route: /admin/remedial
    endpoint: PATCH /api/admin/remedial/:id
    expected: "200 — 'সম্পন্ন' (remedial-menu-complete) prompts for a reason; with a reason supplied the row badge flips to সম্পন্ন and the case leaves the active queue in remedial-count"
  - id: AC-7
    description: "Dismiss a case — reason is mandatory"
    ui_route: /admin/remedial
    endpoint: PATCH /api/admin/remedial/:id
    expected: "200 — 'বাতিল' (remedial-menu-dismiss, is-danger) prompts for a reason; with a reason supplied the row is dismissed, removed from remedial-table and an audit entry is written"
  - id: AC-8
    description: "Escalate a stuck case to a senior reviewer"
    ui_route: /admin/remedial
    endpoint: PATCH /api/admin/remedial/:id
    expected: "200 — escalating from the 'বিস্তারিত' (remedial-menu-view) detail panel sets the row badge to 'উর্ধ্বতনে পাঠানো' (is-warn) and the case appears in the escalation filter"
  - id: AC-9
    description: "Manual teacher recommendation entry from the header CTA"
    ui_route: /admin/remedial
    endpoint: none
    expected: "no HTTP call (endpoint: none) — 'নিজে থেকে সুপারিশ' (remedial-create) opens remedial-modal 'নিজে থেকে সুপারিশ' with remedial-f-student, remedial-f-weakness 'গণিত · ভগ্নাংশের তুলনা' and remedial-f-content plus the help 'শিক্ষকের লাইব্রেরি থেকে বেছে নেওয়া হয় — স্বয়ংক্রিয়ভাবে লেখা হয় না।'; no queue row is written until a spine endpoint exists"

boundary_cases:
  - case: "Complete or dismiss submitted with an empty reason — PATCH returns 422 (reason required), the prompt stays open with the typed text preserved and the row status is unchanged"
  - case: "Reassign to an archived lesson — linked-record guard rejects with 'সংরক্ষিত কনটেন্ট বেছে নেওয়া যায় না' and remedial-f-content keeps only live library options"
  - case: "Whitespace-only search ('   ') is treated as no query — the request goes out without search and remedial-count returns to 'মোট ১২৪ টি · ১৮ টি তালিকাভুক্ত'; a nonsense query leaves zero rows with 'কোনো রিটেক নেই'"
  - case: "Escalating an already escalated row (re-3, badge 'উর্ধ্বতনে পাঠানো') — the PATCH is idempotent: 200 with no duplicate escalation and no double count in remedial-count"
  - case: "Filter/class combination matching nothing — tbody replaced by 'কোনো রিটেক নেই' with pagination 'পৃষ্ঠা ১ / ১' and both 'আগের' and 'পরের' disabled"
  - case: "Bulk bar — remedial-bulk-bar shows '৩ জন নির্বাচিত' after selecting rows; 'সামূহিক কাজ'/'মুছুন' (remedial-bulk-action/remedial-bulk-delete) stay inert because no bulk spine endpoint exists"

error_scenarios:
  - scenario: "401 expired admin session on GET /api/admin/remedial — redirect to /auth/login and back to /admin/remedial after re-login; no partial queue rendered"
  - scenario: "403 — a non-admin session reaching /admin/remedial is bounced to /auth/login without seeing student remedial data"
  - scenario: "500 from GET /api/admin/remedial — inline 'কিছু লোড হয়নি। আবার চেষ্টা করো।' with 'আবার চেষ্টা' retry button; the header CTA stays visible but disabled"
  - scenario: "409 conflict — the case was already completed or dismissed by another admin; the PATCH is refused and the row refreshes to its current status instead of overwriting"
  - scenario: "Network offline while saving a reason — 'ইন্টারনেট সংযোগ নেই।' banner; the reason prompt keeps the admin's text and can be retried"

state_transitions:
  - state: loading
    expected: "Skeleton card with three 16px bars at 72% / 100% / 54% (st-frame); remedial-table and bulk bar hidden until GET /api/admin/remedial resolves"
  - state: empty
    expected: "Empty slot 'কোনো রিটেক নেই' (st-edge) in place of the tbody with the recovery CTA 'নিজে থেকে সুপারিশ' (remedial-create)"
  - state: error
    expected: "Inline 'কিছু লোড হয়নি। আবার চেষ্টা করো।' with 'আবার চেষ্টা' retry button; search and sort headers disabled until retry succeeds"
  - state: escalation
    expected: "Escalated case renders badge 'উর্ধ্বতনে পাঠানো' (is-warn) and is reachable through the escalation filter"
  - state: linked-record
    expected: "Reassign attempt against archived content shows 'সংরক্ষিত কনটেন্ট বেছে নেওয়া যায় না' and the modal keeps its previous selection"

fixture_refs:
